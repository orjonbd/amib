<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Gemini History</title>
    <style>
        body { font-family: sans-serif; padding: 5px; font-size: 13px; }
        .box { border: 1px solid #ccc; padding: 5px; margin-bottom: 8px; background: #f9f9f9; }
        .user { color: blue; font-weight: bold; }
        .ai { color: green; margin-top: 3px; }
        .date-filter { background: #eee; padding: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h3>Gemini AI Lite</h3>

    <!-- নতুন মেসেজ পাঠানোর ফর্ম -->
    <form action="/send" method="POST">
        <textarea name="prompt" rows="2" style="width:95%" required></textarea><br>
        <input type="submit" value="Send">
    </form>
    <hr>

    <!-- তারিখ সিলেক্ট করার Dropdown -->
    <div class="date-filter">
        <form action="/history" method="GET">
            <label>তারিখ বেছে নিন:</label><br>
            <select name="selected_date">
                <option value="2026-08-24">24 Aug 2026</option>
                <option value="2026-08-23">23 Aug 2026</option>
            </select>
            <input type="submit" value="Show">
        </form>
    </div>

    <h4>কথোপকথন হিস্ট্রি</h4>

    <!-- মেসেজ লিস্ট (ডাটাবেজ থেকে যা আসবে) -->
    <div class="box">
        <div class="user">আপনি: কিপ্যাড ফোনে এটি কীভাবে কাজ করবে?</div>
        <div class="ai">Gemini: এটি Serverless backend ও HTML ফর্মের মাধ্যমে কাজ করবে...</div>
        <small style="color:gray;">10:15 AM</small>
        <!-- ডিলিট করার ফর্ম -->
        <form action="/delete" method="POST" style="display:inline;">
            <input type="hidden" name="id" value="123">
            <input type="submit" value="[Delete]" style="color:red; background:none; border:none; cursor:pointer;">
        </form>
    </div>

</body>
</html>
